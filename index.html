<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Raffi Chilingaryan</title>
        <link rel="icon" type="image/png" href="/assets/favicon.png" />
        <link rel="preload" href="/assets/fonts/GeistSerifVF.woff2" as="font" type="font/woff2" crossorigin />
        <style>
            @font-face {
                font-family: "Geist Serif";
                src: url("/assets/fonts/GeistSerifVF.woff2") format("woff2");
                font-weight: 100 900;
                font-display: swap;
            }
            body {
                margin: 0;
                padding: 32px;
                background: #fff;
                color: #000;
                font: 14px/1.4 "Geist Serif", Georgia, serif;
            }
            h1 {
                margin: 0;
                font-size: inherit;
                font-weight: 400;
            }
            nav {
                display: flex;
                flex-wrap: wrap;
                gap: 0 16px;
                margin-top: 16px;
            }
            nav a {
                color: inherit;
                text-decoration: underline;
                text-decoration-thickness: 1px;
                text-underline-offset: 3px;
                text-decoration-color: #999;
            }
        </style>
    </head>
    <body>
        <h1>Raffi Chilingaryan</h1>
        <nav>
            <a href="https://www.spottedinprod.com" data-ios="https://apps.apple.com/us/app/spotted-in-prod/id6821736054">Spotted in Prod</a>
            <a href="https://www.runbuds.app" data-ios="https://apps.apple.com/us/app/runbuds/id6744413545">Runbuds</a>
            <a href="https://apps.apple.com/us/app/floatydo/id6760775568">FloatyDo</a>
            <a href="/2025">2025</a>
        </nav>
        <script>
            // iPhone/iPad visitors go straight to the App Store; everyone else gets the landing page.
            const isIOS =
                /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
            if (isIOS) document.querySelectorAll("a[data-ios]").forEach((a) => (a.href = a.dataset.ios));
        </script>
    </body>
</html>
